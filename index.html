<style>
  /* ============================================================
     dv01 Waterfall Design System — token subset
     Sourced from ux.dv01.co/latest/foundations/design-tokens
     ============================================================ */
  :root {
    /* Brand / Default (gray scale) */
    --color-brand-default-1000: #050505;
    --color-brand-default-950:  #121212;
    --color-brand-default-900:  #1e1e1e;
    --color-brand-default-850:  #2b2b2b;
    --color-brand-default-800:  #373737;
    --color-brand-default-750:  #444444;
    --color-brand-default-700:  #505050;
    --color-brand-default-650:  #5d5d5d;
    --color-brand-default-600:  #696969;
    --color-brand-default-500:  #828282;
    --color-brand-default-400:  #9b9b9b;
    --color-brand-default-300:  #b4b4b4;
    --color-brand-default-250:  #c1c1c1;
    --color-brand-default-200:  #cdcdcd;
    --color-brand-default-100:  #e6e6e6;
    --color-brand-default-50:   #f3f3f3;
    --color-brand-default-10:   #ffffff;

    /* Brand / Primary (purple) */
    --color-brand-primary-base:    #855ffc;
    --color-brand-primary-light:   #cdbcfd;
    --color-brand-primary-dark:    #3606cc;
    --color-brand-primary-600:     #572ae4;
    --color-brand-primary-100:     #f0ebfe;

    /* Brand / Warning (amber — used as the "active" accent in nav) */
    --color-brand-warning-base:    #f5a623;
    --color-brand-warning-light:   #ffe896;
    --color-brand-warning-darker:  #5a3300;

    /* Brand / Success (green) */
    --color-brand-success-base:    #3ab042;

    /* Brand / Info (blue) */
    --color-brand-info-base:       #46afdf;

    /* Semantic (component-level aliases) */
    --color-page-bg:               var(--color-brand-default-1000);
    --color-card-bg:               var(--color-brand-default-900);
    --color-card-bg-elevated:      var(--color-brand-default-850);
    --color-card-border:           var(--color-brand-default-800);
    --color-text-primary:          var(--color-brand-default-10);
    --color-text-secondary:        var(--color-brand-default-300);
    --color-text-tertiary:         var(--color-brand-default-500);
    --color-divider:               var(--color-brand-default-800);

    /* Border radius (Waterfall uses small radii) */
    --radius-sm: 2px;
    --radius-md: 4px;
    --radius-lg: 6px;

    /* Spacing scale (8px grid) */
    --space-100: 4px;
    --space-200: 8px;
    --space-300: 12px;
    --space-400: 16px;
    --space-500: 20px;
    --space-600: 24px;
    --space-700: 32px;
    --space-800: 40px;
    --space-900: 48px;

    /* Shadow */
    --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--color-page-bg);
  }

  body {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: var(--color-text-primary);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: var(--space-700) var(--space-600);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(133, 95, 252, 0.06) 0%, transparent 55%),
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: auto, 32px 32px, 32px 32px;
    background-position: center top, 0 0, 0 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     App bar — minimal chrome mimicking Waterfall app shell
     ============================================================ */
  .app-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-300) var(--space-400);
    border-bottom: 1px solid var(--color-divider);
    margin: calc(-1 * var(--space-700)) calc(-1 * var(--space-600)) var(--space-700);
    background: var(--color-brand-default-1000);
    height: 48px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-300);
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.01em;
  }

  .brand-mark {
    width: 24px; height: 24px;
    border-radius: var(--radius-sm);
    background: var(--color-brand-primary-base);
    display: flex; align-items: center; justify-content: center;
    color: var(--color-brand-default-1000);
    font-weight: 700;
    font-size: 13px;
    font-family: 'Roboto Mono', ui-monospace, monospace;
  }

  .brand-meta {
    color: var(--color-text-tertiary);
    font-weight: 400;
    font-size: 12px;
    border-left: 1px solid var(--color-divider);
    padding-left: var(--space-300);
    margin-left: var(--space-200);
  }

  .breadcrumbs {
    color: var(--color-text-tertiary);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: var(--space-200);
  }
  .breadcrumbs .crumb-active { color: var(--color-text-primary); }
  .breadcrumbs .sep { opacity: 0.5; }

  /* Page heading */
  .page-head {
    max-width: 880px;
    margin: 0 auto var(--space-600);
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: var(--space-400);
  }
  .page-head h1 {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .page-head .subtitle {
    color: var(--color-text-secondary);
    font-size: 13px;
    margin-top: var(--space-100);
  }

  /* Lozenge */
  .lozenge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-100);
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: var(--radius-sm);
    background: var(--color-brand-default-800);
    color: var(--color-brand-default-300);
    border: 1px solid var(--color-divider);
  }
  .lozenge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--color-brand-warning-base);
    box-shadow: 0 0 8px rgba(245, 166, 35, 0.6);
  }

  /* ============================================================
     Card — Waterfall Card compound component
     ============================================================ */
  .card {
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    background: var(--color-card-bg);
    border: 1px solid var(--color-card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 480ms cubic-bezier(0.16, 1, 0.3, 1) 80ms forwards;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-400) var(--space-500);
    border-bottom: 1px solid var(--color-divider);
    min-height: 48px;
  }

  .card-title-group {
    display: flex;
    align-items: center;
    gap: var(--space-300);
  }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-primary);
    letter-spacing: 0.005em;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    background: rgba(133, 95, 252, 0.16);
    color: var(--color-brand-primary-light);
    border: 1px solid rgba(133, 95, 252, 0.3);
    letter-spacing: 0.02em;
  }

  .card-action {
    display: flex;
    align-items: center;
    gap: var(--space-100);
  }

  .icon-btn {
    width: 28px; height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    background: transparent;
    border: none;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover {
    background: var(--color-brand-default-800);
    color: var(--color-text-primary);
  }
  .icon-btn:focus-visible {
    outline: 2px solid var(--color-brand-primary-base);
    outline-offset: 1px;
  }
  .icon-btn svg { width: 14px; height: 14px; }

  .card-content {
    padding: var(--space-700) var(--space-700) var(--space-600);
    display: flex;
    flex-direction: column;
    gap: var(--space-500);
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: var(--space-200);
    flex-wrap: wrap;
  }

  .tag {
    font-family: 'Roboto Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--color-text-tertiary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 8px;
    border: 1px solid var(--color-card-border);
    border-radius: var(--radius-sm);
    background: var(--color-brand-default-950);
  }
  .tag.tag-accent {
    color: var(--color-brand-warning-base);
    border-color: rgba(245, 166, 35, 0.4);
    background: rgba(245, 166, 35, 0.08);
  }

  .quote-block {
    position: relative;
    padding-left: var(--space-500);
    border-left: 2px solid var(--color-brand-primary-base);
  }

  blockquote {
    font-family: 'Roboto', sans-serif;
    font-weight: 300;
    font-size: clamp(20px, 2.4vw, 28px);
    line-height: 1.45;
    color: var(--color-text-primary);
    letter-spacing: -0.005em;
  }

  blockquote::before {
    content: '"';
    font-weight: 700;
    font-size: 1.2em;
    color: var(--color-brand-primary-base);
    margin-right: 2px;
    line-height: 0;
  }
  blockquote::after {
    content: '"';
    font-weight: 700;
    font-size: 1.2em;
    color: var(--color-brand-primary-base);
    margin-left: 2px;
    line-height: 0;
  }

  .attribution {
    display: flex;
    align-items: center;
    gap: var(--space-300);
    color: var(--color-text-secondary);
    font-size: 13px;
    padding-top: var(--space-300);
  }
  .attribution .author {
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-300) var(--space-500);
    border-top: 1px solid var(--color-divider);
    background: var(--color-brand-default-950);
    border-bottom-left-radius: var(--radius-md);
    border-bottom-right-radius: var(--radius-md);
    font-size: 12px;
    color: var(--color-text-tertiary);
    gap: var(--space-400);
    flex-wrap: wrap;
  }

  .data-pair {
    display: inline-flex;
    align-items: baseline;
    gap: var(--space-200);
  }
  .data-pair .label {
    font-family: 'Roboto Mono', ui-monospace, monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-tertiary);
  }
  .data-pair .value {
    font-family: 'Roboto Mono', ui-monospace, monospace;
    font-size: 12px;
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .footer-actions {
    display: flex;
    align-items: center;
    gap: var(--space-300);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--color-brand-success-base);
    color: var(--color-brand-default-1000);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile */
  @media (max-width: 600px) {
    body { padding: var(--space-500) var(--space-300); }
    .app-bar { margin: calc(-1 * var(--space-500)) calc(-1 * var(--space-300)) var(--space-500); padding: var(--space-300); }
    .brand-meta { display: none; }
    .breadcrumbs { display: none; }
    .page-head { flex-direction: column; align-items: flex-start; }
    .card-content { padding: var(--space-500); }
    .card-footer { padding: var(--space-300) var(--space-400); }
  }
</style>
</head>
<body>

  <div class="app-bar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <span>Meditations</span>
      <span class="brand-meta">Daily Insight</span>

    <div class="breadcrumbs">

      <span>Stoic</span>
      <span class="sep">/</span>
      <span class="crumb-active">Marcus Aurelius</span>

  <div class="page-head">
    <div>
      <h1 id="page-title">Today's Reflection</h1>
      <div class="subtitle" id="page-subtitle"></div>

    <span class="lozenge"><span class="dot"></span><span>Live</span></span>

  <article class="card" role="article" aria-labelledby="card-title">

      <div class="card-title-group">
        <span class="card-title" id="card-title">Marcus Aurelius · Meditations</span>
        <span class="badge" id="passage-badge">Book —</span>

      <div class="card-action">
        <button class="icon-btn" id="copy-btn" aria-label="Copy quote" title="Copy quote">

    <footer class="card-footer">
      <div style="display:flex; gap: var(--space-500); flex-wrap: wrap;">

  </article>

  <div class="toast" id="toast" role="status" aria-live="polite">Copied to clipboard</div>

<script>
  // ===========================================================
  // Curated passages from the Meditations of Marcus Aurelius.
  // Translations adapted from public-domain editions (George Long, 1862).
  // ===========================================================
  const quotes = [
    { text: "Begin the morning by saying to thyself, I shall meet with the busy-body, the ungrateful, arrogant, deceitful, envious, unsocial. All these things happen to them by reason of their ignorance of what is good and evil.", book: "II", section: "1" },
    { text: "You have power over your mind — not outside events. Realize this, and you will find strength.", book: "VIII", section: "47" },
    { text: "Waste no more time arguing what a good man should be. Be one.", book: "X", section: "16" },
    { text: "The happiness of your life depends upon the quality of your thoughts.", book: "V", section: "16" },
    { text: "If it is not right, do not do it; if it is not true, do not say it.", book: "XII", section: "17" },
    { text: "Confine thyself to the present.", book: "VII", section: "29" },
    { text: "Everything we hear is an opinion, not a fact. Everything we see is a perspective, not the truth.", book: "IV", section: "3" },
    { text: "Accept the things to which fate binds you, and love the people with whom fate brings you together, and do so with all your heart.", book: "VI", section: "39" },
    { text: "Look well into thyself; there is a source of strength which will always spring up if thou wilt always look there.", book: "VII", section: "59" },
    { text: "The best revenge is to be unlike him who performed the injury.", book: "VI", section: "6" },
    { text: "How much time he gains who does not look to see what his neighbour says or does or thinks.", book: "IV", section: "18" },
    { text: "Whatever anyone does or says, I must be good.", book: "VII", section: "15" },
    { text: "Do every act of thy life as if it were thy last.", book: "II", section: "5" },
    { text: "It is not death that a man should fear, but he should fear never beginning to live.", book: "XII", section: "1" },
    { text: "Loss is nothing else but change, and change is Nature's delight.", book: "IX", section: "35" },
    { text: "Receive without conceit, release without struggle.", book: "VIII", section: "33" },
    { text: "When you arise in the morning, think of what a precious privilege it is to be alive — to breathe, to think, to enjoy, to love.", book: "V", section: "1" },
    { text: "The object of life is not to be on the side of the majority, but to escape finding oneself in the ranks of the insane.", book: "IX", section: "23" },
    { text: "He who lives in harmony with himself lives in harmony with the universe.", book: "VII", section: "9" },
    { text: "If thou art pained by any external thing, it is not this thing that disturbs thee, but thy own judgment about it. And it is in thy power to wipe out this judgment now.", book: "VIII", section: "47" },
    { text: "Such as are thy habitual thoughts, such also will be the character of thy mind; for the soul is dyed by the thoughts.", book: "V", section: "16" },
    { text: "All things are interwoven with one another; a sacred bond unites them; there is scarcely one thing that is isolated from another.", book: "VII", section: "9" },
    { text: "Nothing has such power to broaden the mind as the ability to investigate systematically and truly all that comes under thy observation in life.", book: "III", section: "11" },
    { text: "Reject your sense of injury, and the injury itself disappears.", book: "IV", section: "7" },
    { text: "Dwell on the beauty of life. Watch the stars, and see thyself running with them.", book: "VII", section: "47" },
    { text: "A man's worth is no greater than his ambitions.", book: "VI", section: "51" },
    { text: "Very little is needed to make a happy life; it is all within yourself, in your way of thinking.", book: "VII", section: "67" },
    { text: "When you wake up in the morning, tell yourself: the people I deal with today will be meddling, ungrateful, arrogant, dishonest, jealous, and surly.", book: "II", section: "1" },
    { text: "Adapt thyself to the things with which thy lot has been cast.", book: "VI", section: "39" },
    { text: "How ridiculous and what a stranger he is who is surprised at anything which happens in life.", book: "XII", section: "13" },
    { text: "The universe is change; our life is what our thoughts make it.", book: "IV", section: "3" },
    { text: "Choose not to be harmed — and you won't feel harmed. Don't feel harmed — and you haven't been.", book: "IV", section: "7" },
    { text: "Death smiles at us all; all we can do is smile back.", book: "II", section: "12" },
    { text: "What we do now echoes in eternity.", book: "IV", section: "33" },
    { text: "The art of living is more like wrestling than dancing.", book: "VII", section: "61" },
    { text: "Look back over the past, with its changing empires that rose and fell, and you can foresee the future too.", book: "VII", section: "49" },
    { text: "It is not events that disturb people, it is their judgments concerning them.", book: "XI", section: "16" },

    { text: "Whenever you are about to find fault with someone, ask yourself the following question: What fault of mine most nearly resembles the one I am about to criticize?", book: "X", section: "30" },

    { text: "Each of us lives only now, this brief instant. The rest has been lived already, or is impossible to see.", book: "III", section: "10" },
    { text: "Whatever happens at all happens as it should; thou wilt find this true, if thou shouldst watch narrowly.", book: "IV", section: "10" },
    { text: "Tomorrow is nothing, today is too late; the good lived yesterday.", book: "IV", section: "17" },

    { text: "Do not act as if thou wert going to live ten thousand years. Death hangs over thee. While thou livest, while it is in thy power, be good.", book: "IV", section: "17" },

    { text: "It is in your power to withdraw yourself whenever you desire. Perfect tranquility within consists in the good ordering of the mind.", book: "IV", section: "3" },

  function getDayIndex() {
    const now = new Date();
    const epoch = new Date(2024, 0, 1);
    const oneDay = 1000 * 60 * 60 * 24;
    const days = Math.floor((now - epoch) / oneDay);
    return ((days % quotes.length) + quotes.length) % quotes.length;
  }

  function fmtLong(d) {
    return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  function fmtShort(d) {
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: '2-digit' }).toUpperCase();
  }
  function pad(n, len = 3) { return String(n).padStart(len, '0'); }

  const idx = getDayIndex();
  const q = quotes[idx];
  const today = new Date();

  document.getElementById('page-subtitle').textContent =
    `${fmtLong(today)} · A daily passage from Marcus Aurelius`;
  document.getElementById('passage-badge').textContent = `Book ${q.book}`;
  document.getElementById('tag-date').textContent = fmtShort(today);
  document.getElementById('tag-source').textContent = `Meditations · Bk ${q.book}.${q.section}`;
  document.getElementById('tag-index').textContent = `Entry #${pad(idx + 1)} / ${pad(quotes.length)}`;
  document.getElementById('quote').textContent = q.text;
  document.getElementById('footer-book').textContent = q.book;
  document.getElementById('footer-section').textContent = q.section;
  document.title = `Meditations · Book ${q.book}.${q.section}`;

  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.getElementById('copy-btn').addEventListener('click', async () => {
    const text = `"${q.text}"\n\n— Marcus Aurelius, Meditations · Book ${q.book}.${q.section}`;
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied to clipboard');
    } catch {
      showToast('Copy unavailable');
    }
  });

  document.getElementById('share-btn').addEventListener('click', async () => {
    const shareData = {
      title: 'Daily Marcus Aurelius',
      text: `"${q.text}" — Marcus Aurelius, Meditations · Book ${q.book}.${q.section}`
    };
    if (navigator.share) {
      try { await navigator.share(shareData); } catch {}
    } else {
      try {
        await navigator.clipboard.writeText(shareData.text);
        showToast('Copied — share anywhere');
      } catch {
        showToast('Share unavailable');
      }
    }
  });

  document.getElementById('info-btn').addEventListener('click', () => {
    showToast(`Entry ${idx + 1} of ${quotes.length} · rotates daily`);
  });
</script>
